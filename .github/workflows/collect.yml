name: waitlist-collect

on:
  schedule:
    # Crons are UTC: each time is listed for CDT and again +1h for CST, so no DST edits are ever needed.
    # Three segments, splices at 9:30 and 14:00 CT (away from the 10:00-13:00 decision window).
    # ALL triggers fire at each boundary independently; concurrency dedupes.
    - cron: '30 10 * * *'   # 05:30 CT - segment 1 (06:00-09:30)
    - cron: '30 11 * * *'   # CST twin (+1h UTC); early/extra fires queue or wait, concurrency dedupes
    - cron: '13 11 * * *'   # 06:13 CT - segment 1 second shot
    - cron: '13 12 * * *'   # CST twin (+1h UTC); early/extra fires queue or wait, concurrency dedupes
    - cron: '3 14 * * *'    # 09:03 CT - segment 2 (09:30-14:00), queues behind segment 1
    - cron: '3 15 * * *'   # CST twin (+1h UTC); early/extra fires queue or wait, concurrency dedupes
    - cron: '45 14 * * *'   # 09:45 CT - segment 2 catch-up
    - cron: '45 15 * * *'   # CST twin (+1h UTC); early/extra fires queue or wait, concurrency dedupes
    - cron: '33 18 * * *'   # 13:33 CT - segment 3 (14:00-15:30), queues behind segment 2
    - cron: '33 19 * * *'   # CST twin (+1h UTC); early/extra fires queue or wait, concurrency dedupes
    - cron: '10 19 * * *'   # 14:10 CT - segment 3 catch-up
    - cron: '10 20 * * *'   # CST twin (+1h UTC); early/extra fires queue or wait, concurrency dedupes
  workflow_dispatch:
    inputs:
      smoke_minutes:
        description: 'Sample for N minutes starting now (ignores the open-hours window)'
        required: false

concurrency:
  group: waitlist-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # branch tip at job START, not the stale SHA pinned at run creation

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config user.name "waitlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine sampling window
        id: win
        run: |
          # Segment chosen by Central local time so it is DST-proof (collector.mjs is already CT-aware).
          H=$(TZ=America/Chicago date +%H%M)
          if [ "$H" -lt 0930 ]; then
            echo "start=06:00" >> "$GITHUB_OUTPUT"; echo "end=09:30" >> "$GITHUB_OUTPUT"
          elif [ "$H" -lt 1400 ]; then
            echo "start=09:30" >> "$GITHUB_OUTPUT"; echo "end=14:00" >> "$GITHUB_OUTPUT"
          else
            echo "start=14:00" >> "$GITHUB_OUTPUT"; echo "end=15:30" >> "$GITHUB_OUTPUT"
          fi

      - name: Run collector
        env:
          CI_MODE: '1'
          GIT_COMMIT: '1'
          CHROME_PATH: /usr/bin/google-chrome
          CSV_PATH: data/waitlist_log_ci.csv
          END_CT: '2027-12-31T15:35'
          WINDOW_START: ${{ steps.win.outputs.start }}
          WINDOW_END: ${{ steps.win.outputs.end }}
          SMOKE_MINUTES: ${{ github.event.inputs.smoke_minutes }}
        run: xvfb-run --auto-servernum node collector.mjs

      - name: Final data commit
        if: always()
        run: |
          git add data/ || true
          git commit -m "waitlist data $(date -u +%FT%TZ)" || true
          git pull --rebase || true
          git push || true
