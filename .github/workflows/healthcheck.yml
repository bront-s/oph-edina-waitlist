name: waitlist-healthcheck
# Fails loudly (red X + GitHub notification email) if a day produced no data,
# so a silent stop like Aug 22-30 can never happen again.
on:
  schedule:
    - cron: '45 21 * * *'   # ~4:45 PM CT daily, after the afternoon job has committed
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if today's data is missing or thin
        run: |
          TODAY=$(TZ=America/Chicago date +%Y-%m-%d)
          BEST=0
          for f in data/waitlist_log_ci.csv data/waitlist_log_ci_b.csv; do
            [ -f "$f" ] || continue
            N=$(grep -c "^${TODAY}" "$f" || true)
            echo "samples for ${TODAY} in ${f}: ${N}"
            [ "${N}" -gt "${BEST}" ] && BEST=$N
          done
          if [ "${BEST}" -lt 300 ]; then
            echo "::error::Best lane has only ${BEST} samples for ${TODAY} - no collector lane ran properly!"
            exit 1
          fi
